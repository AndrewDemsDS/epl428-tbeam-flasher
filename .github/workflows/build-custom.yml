name: Build custom firmware (MicroPython + TFLite Micro)

# Builds the "microlite" MicroPython firmware (TensorFlow Lite for Microcontrollers) from
# mocleiri/tensorflow-micropython-examples, freezes a .tflite model into the image, and
# publishes the result as a GitHub Release that the flasher page can list and flash.

on:
  workflow_dispatch:
    inputs:
      board:
        description: Board variant
        type: choice
        default: MICROLITE_S3
        options:
          - MICROLITE_S3
          - MICROLITE_S3_SPIRAM
          - MICROLITE_S3_SPIRAM_OCTAL
      model:
        description: Path to a .tflite file in this repo (blank = models/hello_world_sine.tflite)
        type: string
        default: ""
      model_b64:
        description: Model uploaded from the flasher page, base64 (overrides the path; max about 48 KB)
        type: string
        default: ""
      upstream_ref:
        description: Commit of mocleiri/tensorflow-micropython-examples to build
        type: string
        default: db72b6566f351973d8bc55768effef6e14233068

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BOARD: ${{ inputs.board }}
      REF: ${{ inputs.upstream_ref }}
      MODEL_IN: ${{ inputs.model }}
      MODEL_B64: ${{ inputs.model_b64 }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: self

      - name: Use Python 3.10 (ESP-IDF 4.4 needs an older Python)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Fetch upstream sources
        run: |
          git clone https://github.com/mocleiri/tensorflow-micropython-examples.git up
          cd up
          git checkout "$REF"
          git submodule init
          git submodule update --recursive
          cd micropython
          git submodule update --init lib/axtls
          git submodule update --init lib/berkeley-db-1.xx
          cd ports/esp32
          make BOARD= submodules
          cd ../../..
          cd tflm_esp_kernels
          git submodule update --init components/esp32-camera
          git submodule update --init components/esp-nn

      - name: Select and validate the model
        id: model
        run: |
          MODEL="${MODEL_IN:-models/hello_world_sine.tflite}"
          if [ -n "$MODEL_B64" ]; then
            mkdir -p self/models
            printf '%s' "$MODEL_B64" | base64 -d > self/models/uploaded.tflite
            MODEL=models/uploaded.tflite
          fi
          test -f "self/$MODEL" || { echo "model not found: $MODEL"; exit 1; }
          # TFLite flatbuffers carry the identifier TFL3 at byte offset 4.
          test "$(dd if="self/$MODEL" bs=1 skip=4 count=4 2>/dev/null)" = "TFL3" || { echo "$MODEL is not a TFLite model"; exit 1; }
          SIZE=$(stat -c %s "self/$MODEL")
          test "$SIZE" -le 1048576 || { echo "model is $SIZE bytes; limit is 1 MiB"; exit 1; }
          echo "path=$MODEL" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "self/$MODEL" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Freeze the model into the firmware
        run: |
          mkdir -p frozen
          python3 - "self/${{ steps.model.outputs.path }}" <<'PY'
          import sys
          data = open(sys.argv[1], "rb").read()
          with open("frozen/tflm_model.py", "w") as f:
              f.write("# generated by the build workflow\n")
              f.write("MODEL = %r\n\n" % data)
              f.write("def load():\n")
              f.write("    # microlite wants a writable, aligned buffer; copy the frozen bytes into RAM\n")
              f.write("    return bytearray(MODEL)\n")
          PY
          cat > frozen/manifest.py <<EOF
          include("\$(PORT_DIR)/boards/manifest.py")
          module("tflm_model.py", base_path="$PWD/frozen")
          EOF
          cat frozen/manifest.py

      - name: Setup ESP-IDF
        working-directory: up
        run: source ./micropython/tools/ci.sh && ci_esp32_idf44_setup

      - name: Generate TensorFlow Lite Micro sources
        working-directory: up
        run: |
          source ./esp-idf/export.sh
          pip3 install Pillow Wave
          rm -rf ./micropython-modules/microlite/tflm
          cd ./tensorflow
          ../micropython-modules/microlite/prepare-tflm-esp.sh

      - name: Build mpy-cross
        working-directory: up
        run: |
          source ./esp-idf/export.sh
          make -C micropython/mpy-cross V=1 clean all

      - name: Build firmware
        working-directory: up
        run: |
          source ./esp-idf/export.sh
          cd "boards/esp32/$BOARD"
          rm -rf build
          idf.py -DMICROPY_FROZEN_MANIFEST="$GITHUB_WORKSPACE/frozen/manifest.py" clean build
          ../../../micropython-modules/microlite/assemble-unified-image-esp.sh "$GITHUB_WORKSPACE/up/micropython/ports/esp32"
          ls -l build/firmware.bin

      - name: Collect facts about the build
        id: facts
        working-directory: up
        run: |
          MPV=$(grep -h -E '^#define MICROPY_VERSION_(MAJOR|MINOR|MICRO)' micropython/py/mpconfig.h micropython/py/*.h 2>/dev/null | awk '{print $3}' | head -3 | paste -sd. -)
          IDFV=$(strings "boards/esp32/$BOARD/build/micropython.bin" | grep -m1 -o -E 'v[45]\.[0-9]+(\.[0-9]+)?(-[a-z0-9]+)?' || true)
          MPC=$(git -C micropython rev-parse --short HEAD)
          echo "mp=$MPV" >> "$GITHUB_OUTPUT"
          echo "idf=$IDFV" >> "$GITHUB_OUTPUT"
          echo "mpc=$MPC" >> "$GITHUB_OUTPUT"
          mkdir -p "$GITHUB_WORKSPACE/out"
          TAG="custom-${GITHUB_RUN_NUMBER}"
          NAME="microlite-${BOARD}-${TAG}.bin"
          cp "boards/esp32/$BOARD/build/firmware.bin" "$GITHUB_WORKSPACE/out/$NAME"
          SHA=$(sha256sum "$GITHUB_WORKSPACE/out/$NAME" | cut -d' ' -f1)
          SIZE=$(stat -c %s "$GITHUB_WORKSPACE/out/$NAME")
          cat > "$GITHUB_WORKSPACE/out/build-info.json" <<EOF
          {
            "tag": "$TAG",
            "file": "$NAME",
            "board": "$BOARD",
            "address": 0,
            "size": $SIZE,
            "sha256": "$SHA",
            "micropython": "$MPV",
            "micropython_commit": "$MPC",
            "idf": "$IDFV",
            "upstream_ref": "$REF",
            "model": "${{ steps.model.outputs.path }}",
            "model_size": ${{ steps.model.outputs.size }},
            "model_sha256": "${{ steps.model.outputs.sha256 }}"
          }
          EOF
          cat "$GITHUB_WORKSPACE/out/build-info.json"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          gh release create "${{ steps.facts.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --title "Custom build ${{ steps.facts.outputs.tag }} (${BOARD})" \
            --notes "MicroPython + TFLite Micro (microlite). Board: ${BOARD}. Model: ${{ steps.model.outputs.path }} (${{ steps.model.outputs.size }} bytes), frozen as the module tflm_model. Flash at address 0." \
            *.bin build-info.json
